<style>

<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="mobile-handle" id="mobileHandle"></div>
    <div class="brand" id="brandLogo" role="button" tabindex="0" aria-label="Bodhi Roots admin access">
      <div class="brand-mark"><i class="fa-solid fa-tree"></i></div>
      <div class="brand-text"><h1>Bodhi Roots</h1><p>Legacy Map</p></div>
      <div class="sync-line"><span class="sync-dot" id="syncDot"></span><span id="syncText">Offline</span></div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="search" placeholder="Search tree code, owner, dedication, species" autocomplete="off">
        <button class="clear-search" id="clearSearch" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <section class="stats" aria-label="Map statistics">
      <div class="stat"><div class="stat-label">Total Trees</div><div class="stat-value" id="statTrees">0</div></div>
      <div class="stat"><div class="stat-label">Total Photos</div><div class="stat-value" id="statPhotos">0</div></div>
      <div class="stat"><div class="stat-label">Species</div><div class="stat-value" id="statSpecies">0</div></div>
      <div class="stat"><div class="stat-label">Latest Update</div><div class="stat-value" id="statLatest">—</div></div>
    </section>
    <div class="list-head"><h2>Trees</h2><span class="list-count" id="listCount">0 shown</span></div>
    <div class="tree-list" id="treeList"></div>
  </aside>
  <main id="map" aria-label="Bodhi Roots legacy map"></main>
  <div class="profile" id="profilePanel" aria-live="polite">
    <button class="profile-close" id="closeProfile" aria-label="Close profile"><i class="fa-solid fa-xmark"></i></button>
    <div class="profile-scroll" id="profileContent"></div>
  </div>
  <div class="admin-bar" id="adminBar">
    <div class="admin-chip"><i class="fa-solid fa-lock-open"></i><span>Admin</span></div>
    <button class="btn btn-primary" data-admin="add"><i class="fa-solid fa-plus"></i>Add Tree</button>
    <button class="btn btn-soft" data-admin="edit"><i class="fa-solid fa-pen"></i>Edit</button>
    <button class="btn btn-soft" data-admin="photos"><i class="fa-solid fa-images"></i>Photos</button>
    <button class="btn btn-soft" data-admin="timeline"><i class="fa-solid fa-clock"></i>Update</button>
    <button class="btn btn-soft" data-admin="qr"><i class="fa-solid fa-qrcode"></i>QR</button>
    <button class="btn btn-soft" data-admin="export"><i class="fa-solid fa-download"></i>Export</button>
    <button class="btn btn-red" data-admin="delete"><i class="fa-solid fa-trash"></i>Delete</button>
  </div>
  <div class="config-warning" id="configWarning"><strong>Repository configuration required</strong><span>Set CONFIG owner, repo, branch, and token inside this file to connect the live GitHub database.</span></div>
</div>
<div class="loader" id="loader"><div class="loader-card"><span class="spinner"></span><span id="loaderText">Loading</span></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" id="modalBox" role="dialog" aria-modal="true">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" id="modalClose" aria-label="Close modal"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-search/4.0.0/leaflet-search.src.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/lightgallery.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/plugins/thumbnail/lg-thumbnail.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.9.0/plugins/zoom/lg-zoom.umd.min.js"></script>
<script>
const CONFIG={owner:"",repo:"",branch:"main",token:""};
const ADMIN_PASSWORD="";
(function(){
'use strict';
const STATUS_TYPES=["Reserved","Planted","Growing","Needs Attention","Memorial"];
const STATUS_CLASS=s=>String(s||"Reserved").replace(/\s+/g,"-");
const PLACEHOLDER_IMAGE='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"><rect width="600" height="400" fill="#F9F9F5"/><circle cx="300" cy="178" r="70" fill="#e8eadf"/><path d="M302 105c-28 44-39 84-20 122 38-20 55-60 20-122Z" fill="#184B2D" opacity=".78"/><path d="M300 218v74" stroke="#184B2D" stroke-width="9" stroke-linecap="round" opacity=".72"/><text x="300" y="338" text-anchor="middle" fill="#6f7d73" font-family="Arial" font-size="22" font-weight="700">Bodhi Roots</text></svg>');
const $=id=>document.getElementById(id);
const state={map:null,cluster:null,markers:new Map(),trees:[],filtered:[],selectedCode:null,admin:false,logoClicks:0,logoTimer:null,gallery:null,searchTimer:null,loading:false};
function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function attr(v){return esc(v).replace(/`/g,'&#96;');}
function clean(v){return String(v??"").trim();}
function nowISO(){return new Date().toISOString();}
function sameCode(a,b){return clean(a).toUpperCase()===clean(b).toUpperCase();}
function slug(v){return clean(v).replace(/[^a-z0-9._-]+/gi,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||'file';}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/');}
function rawUrl(path){return `https://raw.githubusercontent.com/${encodeURIComponent(CONFIG.owner)}/${encodeURIComponent(CONFIG.repo)}/${encodeURIComponent(CONFIG.branch)}/${encodePath(path)}`;}
function validConfig(){return !!(clean(CONFIG.owner)&&clean(CONFIG.repo)&&clean(CONFIG.branch));}
function setSync(type,text){const dot=$('syncDot'),label=$('syncText');dot.className='sync-dot '+(type||'');label.textContent=text||'';}
function showLoader(text){state.loading=true;$('loaderText').textContent=text||'Loading';$('loader').classList.add('show');setSync('busy',text||'Working');}
function hideLoader(){state.loading=false;$('loader').classList.remove('show');setSync('ok','Live');}
function toast(title,message,type='success',timeout=4200){const wrap=$('toastWrap');const div=document.createElement('div');div.className='toast '+(type==='error'?'error':type==='busy'?'busy':'');div.innerHTML=`<i class="fa-solid ${type==='error'?'fa-triangle-exclamation':type==='busy'?'fa-circle-notch fa-spin':'fa-circle-check'}"></i><div><strong>${esc(title)}</strong><p>${esc(message||'')}</p></div>`;wrap.appendChild(div);setTimeout(()=>{div.style.opacity='0';div.style.transform='translateY(8px)';setTimeout(()=>div.remove(),220);},timeout);}
function debounce(fn,ms){return function(...args){clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>fn.apply(this,args),ms);};}
function toBase64Unicode(str){return btoa(unescape(encodeURIComponent(str)));}
function fromBase64Unicode(str){return decodeURIComponent(escape(atob(String(str||'').replace(/\s/g,''))));}
async function githubRequest(path,method='GET',body=null){if(!validConfig())throw new Error('GitHub repository is not configured.');const url=`https://api.github.com/repos/${encodeURIComponent(CONFIG.owner)}/${encodeURIComponent(CONFIG.repo)}/contents/${encodePath(path)}`;const headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(clean(CONFIG.token))headers.Authorization=`Bearer ${CONFIG.token}`;if(body)headers['Content-Type']='application/json';const res=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined});let data=null;const text=await res.text();try{data=text?JSON.parse(text):null}catch(e){data={message:text}}if(!res.ok){const err=new Error(data&&data.message?data.message:`GitHub API error ${res.status}`);err.status=res.status;err.data=data;throw err;}return data;}
async function readContent(path){try{const data=await githubRequest(path,'GET');if(Array.isArray(data))return{exists:true,isDirectory:true,items:data};return{exists:true,sha:data.sha,content:data.content?fromBase64Unicode(data.content):'',download_url:data.download_url||null,data};}catch(e){if(e.status===404)return{exists:false,sha:null,content:null};throw e;}}
async function putContent(path,plainOrBase64,message,sha,isBase64=false){const body={message,content:isBase64?plainOrBase64:toBase64Unicode(plainOrBase64),branch:CONFIG.branch};if(sha)body.sha=sha;return githubRequest(path,'PUT',body);}
async function deleteContent(path,message){const existing=await readContent(path);if(!existing.exists||!existing.sha)return false;await githubRequest(path,'DELETE',{message,sha:existing.sha,branch:CONFIG.branch});return true;}
async function getTreesFresh(){const file=await readContent('trees.json');if(!file.exists)return{trees:[],sha:null};let parsed=[];try{parsed=JSON.parse(file.content||'[]')}catch(e){throw new Error('trees.json exists but contains invalid JSON.');}const arr=Array.isArray(parsed)?parsed:Array.isArray(parsed.trees)?parsed.trees:[];return{trees:arr.map(normalizeTree).filter(Boolean),sha:file.sha};}
async function saveTreesFresh(mutator,message){const fresh=await getTreesFresh();const cloned=fresh.trees.map(t=>JSON.parse(JSON.stringify(t)));const result=await mutator(cloned);const content=JSON.stringify(cloned.map(normalizeTree),null,2)+'\n';await putContent('trees.json',content,message,fresh.sha,false);state.trees=cloned.map(normalizeTree);applyFilter(false);return result;}
function normalizeTree(t,index=0){if(!t||typeof t!=='object')return null;const code=clean(t.treeCode||t.id||`BR${String(index+1).padStart(3,'0')}`).toUpperCase();const status=STATUS_TYPES.includes(clean(t.status))?clean(t.status):'Reserved';const gallery=Array.isArray(t.photoGallery)?t.photoGallery.filter(Boolean).map(clean):[];const updates=Array.isArray(t.updates)?t.updates.filter(Boolean).map(u=>({date:clean(u.date),photo:clean(u.photo),description:clean(u.description),createdAt:clean(u.createdAt||u.date||'')})):[];return{id:clean(t.id)||code,treeCode:code,ownerName:clean(t.ownerName),dedicatedTo:clean(t.dedicatedTo),message:clean(t.message),species:clean(t.species),latitude:clean(t.latitude),longitude:clean(t.longitude),plantingDate:clean(t.plantingDate),status,coverPhoto:clean(t.coverPhoto),photoGallery:gallery,updates,createdAt:clean(t.createdAt)||nowISO(),updatedAt:clean(t.updatedAt)||nowISO()};}
function getCoords(t){const lat=parseFloat(t.latitude),lng=parseFloat(t.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat<-90||lat>90||lng<-180||lng>180)return null;return[lat,lng];}
function displayDate(v){if(!v)return'—';const d=new Date(v);if(!Number.isNaN(d.getTime()))return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});return v;}
function latestDate(trees){let latest=null;trees.forEach(t=>{[t.updatedAt,t.createdAt,t.plantingDate,...(t.updates||[]).map(u=>u.date||u.createdAt)].forEach(v=>{if(!v)return;const d=new Date(v);if(!Number.isNaN(d.getTime())&&(!latest||d>latest))latest=d;});});return latest?latest.toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—';}
function imageOf(t){return t.coverPhoto||t.photoGallery?.[0]||t.updates?.find(u=>u.photo)?.photo||PLACEHOLDER_IMAGE;}
function initMap(){state.map=L.map('map',{zoomControl:true,preferCanvas:true,worldCopyJump:true}).setView([27.4728,89.6390],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(state.map);state.cluster=L.markerClusterGroup({spiderfyOnMaxZoom:true,showCoverageOnHover:false,chunkedLoading:true,maxClusterRadius:52});state.map.addLayer(state.cluster);setTimeout(()=>state.map.invalidateSize(),250);}
function markerIcon(t,selected=false){return L.divIcon({className:'',html:`<div class="custom-marker marker-${STATUS_CLASS(t.status)} ${selected?'selected':''}"><i class="fa-solid fa-seedling"></i></div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-18]});}
function popupHTML(t){return `<div class="popup-card"><img class="popup-img" src="${attr(imageOf(t))}" loading="lazy" onerror="this.src='${PLACEHOLDER_IMAGE}'"><div class="popup-body"><div class="popup-code">${esc(t.treeCode)}</div><div class="popup-owner">${esc(t.ownerName||'Unnamed owner')}</div><div class="popup-row"><span class="status-pill status-${STATUS_CLASS(t.status)}">${esc(t.status)}</span><button class="popup-btn" onclick="BodhiApp.openByCode('${attr(t.treeCode)}')">Open</button></div></div></div>`;}
function renderMarkers(fit=true){state.cluster.clearLayers();state.markers.clear();let bounds=[];state.filtered.forEach(t=>{const coords=getCoords(t);if(!coords)return;const m=L.marker(coords,{icon:markerIcon(t,sameCode(t.treeCode,state.selectedCode)),title:`${t.treeCode} ${t.ownerName} ${t.dedicatedTo} ${t.species}`});m.bindPopup(popupHTML(t),{closeButton:false});m.on('click',()=>openTree(t.treeCode,true));state.markers.set(t.treeCode,m);state.cluster.addLayer(m);bounds.push(coords);});if(fit&&bounds.length){state.map.fitBounds(bounds,{padding:[42,42],maxZoom:16,animate:true});}else if(!bounds.length){state.map.setView([27.4728,89.6390],13);}}
function refreshMarkerSelection(){state.markers.forEach((m,code)=>{const t=state.trees.find(x=>sameCode(x.treeCode,code));if(t)m.setIcon(markerIcon(t,sameCode(code,state.selectedCode)));});}
function renderStats(){const trees=state.filtered;const photos=trees.reduce((n,t)=>n+(t.coverPhoto?1:0)+(t.photoGallery?.length||0)+(t.updates||[]).filter(u=>u.photo).length,0);const species=new Set(trees.map(t=>t.species.toLowerCase()).filter(Boolean));$('statTrees').textContent=trees.length;$('statPhotos').textContent=photos;$('statSpecies').textContent=species.size;$('statLatest').textContent=latestDate(trees);$('listCount').textContent=`${trees.length} shown`;}
function renderList(){const box=$('treeList');if(!state.filtered.length){box.innerHTML='<div class="empty">No tree records found.</div>';return;}box.innerHTML=state.filtered.map(t=>`<button class="tree-card ${sameCode(t.treeCode,state.selectedCode)?'active':''}" data-tree="${attr(t.treeCode)}"><img class="tree-thumb" src="${attr(imageOf(t))}" loading="lazy" onerror="this.src='${PLACEHOLDER_IMAGE}'"><span><span class="tree-card-title"><span class="tree-code">${esc(t.treeCode)}</span><span class="status-pill status-${STATUS_CLASS(t.status)}">${esc(t.status)}</span></span><span class="tree-owner">${esc(t.ownerName||'Unnamed owner')}</span><span class="tree-meta"><span class="mini">${esc(t.species||'Species not set')}</span>${t.dedicatedTo?`<span class="mini">For ${esc(t.dedicatedTo)}</span>`:''}</span></span></button>`).join('');}
function applyFilter(fit=true){const q=clean($('searchInput').value).toLowerCase();$('clearSearch').classList.toggle('show',!!q);state.filtered=state.trees.filter(t=>!q||[t.treeCode,t.ownerName,t.dedicatedTo,t.species,t.message,t.status].join(' ').toLowerCase().includes(q));renderStats();renderList();renderMarkers(fit);refreshProfileIfOpen();}
function openTree(code,moveMap=true){const t=state.trees.find(x=>sameCode(x.treeCode,code));if(!t){toast('Tree not found',`No record matches ${code}.`,'error');return;}state.selectedCode=t.treeCode;renderList();refreshMarkerSelection();const coords=getCoords(t);if(coords&&moveMap){state.map.flyTo(coords,17,{duration:.75});const marker=state.markers.get(t.treeCode);if(marker)setTimeout(()=>marker.openPopup(),500);}renderProfile(t);const url=new URL(window.location.href);url.searchParams.set('tree',t.treeCode);history.replaceState(null,'',url.toString());if(window.innerWidth<=920)$('sidebar').classList.remove('expanded');}
function closeProfile(){state.selectedCode=null;$('profilePanel').classList.remove('open');renderList();refreshMarkerSelection();const url=new URL(window.location.href);url.searchParams.delete('tree');history.replaceState(null,'',url.toString());}
function profileAdminButtons(t){if(!state.admin)return'';return `<div class="admin-actions-inline"><button class="btn btn-primary" data-admin="edit"><i class="fa-solid fa-pen"></i>Edit Tree</button><button class="btn btn-soft" data-admin="photos"><i class="fa-solid fa-images"></i>Upload Photos</button><button class="btn btn-soft" data-admin="timeline"><i class="fa-solid fa-clock"></i>Add Update</button><button class="btn btn-soft" data-admin="qr"><i class="fa-solid fa-qrcode"></i>Download QR</button></div>`;}
function renderProfile(t){if(state.gallery){try{state.gallery.destroy(true)}catch(e){}state.gallery=null;}const gallery=[...new Set([...(t.coverPhoto?[t.coverPhoto]:[]),...(t.photoGallery||[]),...(t.updates||[]).map(u=>u.photo).filter(Boolean)])];const timeline=[...(t.updates||[])].sort((a,b)=>new Date(b.date||b.createdAt||0)-new Date(a.date||a.createdAt||0));$('profileContent').innerHTML=`<div class="cover"><img src="${attr(imageOf(t))}" loading="eager" onerror="this.src='${PLACEHOLDER_IMAGE}'"><div class="cover-code"><h2>${esc(t.treeCode)}</h2><p>${esc(t.species||'Legacy tree')}</p></div></div><div class="profile-body"><div class="profile-top"><div class="profile-title"><h3>${esc(t.ownerName||'Unnamed owner')}</h3><p>${t.dedicatedTo?'Dedicated to '+esc(t.dedicatedTo):'Dedication not set'}</p></div><span class="status-pill status-${STATUS_CLASS(t.status)}">${esc(t.status)}</span></div>${t.message?`<div class="message-box">${esc(t.message)}</div>`:''}<div class="info-grid"><div class="info"><span>Species</span><strong>${esc(t.species||'—')}</strong></div><div class="info"><span>Planting Date</span><strong>${esc(displayDate(t.plantingDate))}</strong></div><div class="info"><span>Latitude</span><strong>${esc(t.latitude||'—')}</strong></div><div class="info"><span>Longitude</span><strong>${esc(t.longitude||'—')}</strong></div></div>${profileAdminButtons(t)}<div class="section-title"><h4>QR Code</h4><small>${esc(t.treeCode)}</small></div><div class="qr-card"><div id="qrCode"></div><p>Scan to open this tree profile directly on the Bodhi Roots Legacy Map.</p></div><div class="section-title"><h4>Gallery</h4><small>${gallery.length} photos</small></div><div class="gallery-grid" id="galleryGrid">${gallery.length?gallery.map((src,i)=>`<a class="gallery-item" href="${attr(src)}" data-src="${attr(src)}"><img src="${attr(src)}" loading="lazy" onerror="this.src='${PLACEHOLDER_IMAGE}'">${state.admin?`<span class="gallery-admin"><button class="icon-mini" data-photo-action="cover" data-photo="${attr(src)}" title="Set cover"><i class="fa-solid fa-star"></i></button><button class="icon-mini" data-photo-action="delete" data-photo="${attr(src)}" title="Delete photo"><i class="fa-solid fa-trash"></i></button></span>`:''}</a>`).join(''):'<div class="empty" style="grid-column:1/-1">No photos uploaded yet.</div>'}</div><div class="section-title"><h4>Timeline</h4><small>${timeline.length} updates</small></div><div class="timeline">${timeline.length?timeline.map(u=>`<div class="timeline-item"><img class="timeline-photo" src="${attr(u.photo||PLACEHOLDER_IMAGE)}" loading="lazy" onerror="this.src='${PLACEHOLDER_IMAGE}'"><div><div class="timeline-date">${esc(displayDate(u.date||u.createdAt))}</div><div class="timeline-desc">${esc(u.description||'Update')}</div></div></div>`).join(''):'<div class="empty">No timeline updates yet.</div>'}</div></div>`;$('profilePanel').classList.add('open');const qr=$('qrCode');qr.innerHTML='';new QRCode(qr,{text:treeLink(t.treeCode),width:110,height:110,colorDark:'#184B2D',colorLight:'#F9F9F5',correctLevel:QRCode.CorrectLevel.H});const grid=$('galleryGrid');if(gallery.length&&window.lightGallery){state.gallery=lightGallery(grid,{selector:'.gallery-item',plugins:[lgZoom,lgThumbnail],speed:280,download:false,actualSize:true,mobileSettings:{controls:true,showCloseIcon:true,download:false}});} }
function refreshProfileIfOpen(){if(!$('profilePanel').classList.contains('open')||!state.selectedCode)return;const t=state.trees.find(x=>sameCode(x.treeCode,state.selectedCode));if(t)renderProfile(t);else closeProfile();}
function treeLink(code){const url=new URL(window.location.href);url.searchParams.set('tree',code);return url.toString();}
function openModal(title,body,footer='',small=false){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').innerHTML=footer;$('modalBox').classList.toggle('small',!!small);$('modalBackdrop').classList.add('show');$('modalBackdrop').setAttribute('aria-hidden','false');setTimeout(()=>{const first=$('modalBody').querySelector('input,textarea,select,button');if(first)first.focus();},40);}
function closeModal(){$('modalBackdrop').classList.remove('show');$('modalBackdrop').setAttribute('aria-hidden','true');$('modalBody').innerHTML='';$('modalFoot').innerHTML='';}
function formFields(t={}){const status=clean(t.status)||'Reserved';return `<div class="form-grid"><div class="field"><label>Tree Code</label><input name="treeCode" required value="${attr(t.treeCode||'')}"></div><div class="field"><label>Status</label><select name="status">${STATUS_TYPES.map(s=>`<option value="${attr(s)}" ${s===status?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Owner Name</label><input name="ownerName" value="${attr(t.ownerName||'')}"></div><div class="field"><label>Dedicated To</label><input name="dedicatedTo" value="${attr(t.dedicatedTo||'')}"></div><div class="field full"><label>Message</label><textarea name="message">${esc(t.message||'')}</textarea></div><div class="field"><label>Species</label><input name="species" value="${attr(t.species||'')}"></div><div class="field"><label>Planting Date</label><input type="date" name="plantingDate" value="${attr((t.plantingDate||'').slice(0,10))}"></div><div class="field"><label>Latitude</label><input name="latitude" inputmode="decimal" value="${attr(t.latitude||'')}"></div><div class="field"><label>Longitude</label><input name="longitude" inputmode="decimal" value="${attr(t.longitude||'')}"></div><div class="field full"><label>${t.treeCode?'Replace Cover Photo':'Cover Photo Upload'}</label><input type="file" name="coverPhoto" accept="image/*"><div class="hint">Images are uploaded to GitHub under photos/{tree code}/ and saved into trees.json.</div></div></div>`;}
function getFormData(form){const fd=new FormData(form);const code=clean(fd.get('treeCode')).toUpperCase();if(!code)throw new Error('Tree Code is required.');const lat=clean(fd.get('latitude')),lng=clean(fd.get('longitude'));if((lat||lng)&&!getCoords({latitude:lat,longitude:lng}))throw new Error('GPS coordinates are invalid.');return{treeCode:code,ownerName:clean(fd.get('ownerName')),dedicatedTo:clean(fd.get('dedicatedTo')),message:clean(fd.get('message')),species:clean(fd.get('species')),latitude:lat,longitude:lng,plantingDate:clean(fd.get('plantingDate')),status:clean(fd.get('status'))||'Reserved'};}
async function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const result=String(reader.result||'');resolve(result.includes(',')?result.split(',')[1]:result);};reader.onerror=()=>reject(new Error('Unable to read image file.'));reader.readAsDataURL(file);});}
function imageExt(file){const byType={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","image/svg+xml":"svg"};return byType[file.type]||(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';}
async function uploadImage(treeCode,file,sub=''){if(!file)return'';if(!file.type.startsWith('image/'))throw new Error('Only image files can be uploaded.');const base64=await fileToBase64(file);const name=`${Date.now()}-${Math.random().toString(36).slice(2,8)}-${slug(file.name.replace(/\.[^.]+$/,''))}.${imageExt(file)}`;const path=['photos',slug(treeCode),sub?slug(sub):'',name].filter(Boolean).join('/');const existing=await readContent(path);const res=await putContent(path,base64,`Upload ${path}`,existing.sha,true);return res.content?.download_url||rawUrl(path);}
function pathFromUrl(url){try{const u=new URL(url);if(u.hostname==='raw.githubusercontent.com'){const parts=u.pathname.split('/').filter(Boolean);if(parts[0]===CONFIG.owner&&parts[1]===CONFIG.repo&&parts[2]===CONFIG.branch)return decodeURIComponent(parts.slice(3).join('/'));}if(u.hostname==='github.com'){const parts=u.pathname.split('/').filter(Boolean);const rawIndex=parts.indexOf('raw');if(parts[0]===CONFIG.owner&&parts[1]===CONFIG.repo&&rawIndex>=0&&parts[rawIndex+1]===CONFIG.branch)return decodeURIComponent(parts.slice(rawIndex+2).join('/'));}}catch(e){}const m=String(url||'').match(/photos\/.+$/);return m?decodeURIComponent(m[0]):'';}
async function deleteImageUrl(url){const path=pathFromUrl(url);if(!path||!path.startsWith('photos/'))return false;return deleteContent(path,`Delete ${path}`);}
function requireAdmin(){if(!state.admin){toast('Admin required','Unlock admin mode first.','error');return false}if(!clean(CONFIG.token)){toast('GitHub token required','Set CONFIG.token to save changes to GitHub.','error');return false}return true;}
function selectedTree(){return state.trees.find(t=>sameCode(t.treeCode,state.selectedCode));}
function openPassword(){openModal('Admin Access',`<div class="field"><label>Password</label><input id="adminPass" type="password" autocomplete="current-password"></div>`,`<button class="btn btn-soft" id="cancelAdmin">Cancel</button><button class="btn btn-primary" id="unlockAdmin"><i class="fa-solid fa-unlock"></i>Unlock</button>`,true);$('cancelAdmin').onclick=closeModal;$('unlockAdmin').onclick=()=>{const v=$('adminPass').value;if(v===ADMIN_PASSWORD){state.admin=true;document.body.classList.add('admin-mode');closeModal();toast('Admin mode enabled','You can now manage tree records.');refreshProfileIfOpen();}else toast('Wrong password','Admin access was not unlocked.','error');};$('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('unlockAdmin').click();});}
function openAddForm(){if(!requireAdmin())return;openModal('Create Tree',`<form id="treeForm">${formFields({status:'Reserved'})}</form>`,`<button class="btn btn-soft" id="cancelForm">Cancel</button><button class="btn btn-primary" id="saveTree"><i class="fa-solid fa-floppy-disk"></i>Create Tree</button>`);$('cancelForm').onclick=closeModal;$('saveTree').onclick=async()=>{const form=$('treeForm');try{const data=getFormData(form);const file=form.elements.coverPhoto.files[0];showLoader('Creating tree');let cover='';if(file){$('loaderText').textContent='Uploading cover photo';cover=await uploadImage(data.treeCode,file);}await saveTreesFresh(trees=>{if(trees.some(t=>sameCode(t.treeCode,data.treeCode)))throw new Error('A tree with this Tree Code already exists.');trees.push(normalizeTree({...data,id:data.treeCode,coverPhoto:cover,photoGallery:cover?[cover]:[],updates:[],createdAt:nowISO(),updatedAt:nowISO()}));},`Create tree ${data.treeCode}`);hideLoader();closeModal();toast('Tree created',`${data.treeCode} was saved to GitHub.`);openTree(data.treeCode,true);}catch(e){hideLoader();toast('Create failed',e.message,'error');}};}
function openEditForm(){if(!requireAdmin())return;const t=selectedTree();if(!t){toast('Select a tree','Open a tree profile before editing.','error');return;}openModal('Edit Tree',`<form id="treeForm">${formFields(t)}</form>`,`<button class="btn btn-soft" id="cancelForm">Cancel</button><button class="btn btn-primary" id="saveTree"><i class="fa-solid fa-floppy-disk"></i>Save Changes</button>`);$('cancelForm').onclick=closeModal;$('saveTree').onclick=async()=>{const form=$('treeForm');try{const data=getFormData(form);const file=form.elements.coverPhoto.files[0];showLoader('Saving tree');let newCover='';if(file){$('loaderText').textContent='Uploading cover photo';newCover=await uploadImage(data.treeCode,file);}await saveTreesFresh(trees=>{const idx=trees.findIndex(x=>sameCode(x.treeCode,t.treeCode));if(idx<0)throw new Error('Tree record no longer exists.');if(!sameCode(data.treeCode,t.treeCode)&&trees.some(x=>sameCode(x.treeCode,data.treeCode)))throw new Error('Another tree already uses this Tree Code.');const existing=trees[idx];trees[idx]=normalizeTree({...existing,...data,id:data.treeCode,coverPhoto:newCover||existing.coverPhoto,photoGallery:newCover?[newCover,...(existing.photoGallery||[]).filter(p=>p!==newCover)]:existing.photoGallery,updatedAt:nowISO()});},`Update tree ${data.treeCode}`);hideLoader();closeModal();toast('Tree updated',`${data.treeCode} was saved to GitHub.`);openTree(data.treeCode,false);}catch(e){hideLoader();toast('Save failed',e.message,'error');}};}
function openPhotoUpload(){if(!requireAdmin())return;const t=selectedTree();if(!t){toast('Select a tree','Open a tree profile before uploading photos.','error');return;}openModal('Upload Photos',`<div class="field"><label>Photos for ${esc(t.treeCode)}</label><input id="galleryFiles" type="file" accept="image/*" multiple><div class="hint">You can select multiple images. Each file will be uploaded to GitHub and added to the gallery.</div></div>`,`<button class="btn btn-soft" id="cancelUpload">Cancel</button><button class="btn btn-primary" id="savePhotos"><i class="fa-solid fa-upload"></i>Upload Photos</button>`);$('cancelUpload').onclick=closeModal;$('savePhotos').onclick=async()=>{const files=Array.from($('galleryFiles').files||[]);if(!files.length){toast('No photos selected','Choose at least one image.','error');return;}try{showLoader('Uploading images');const urls=[];for(let i=0;i<files.length;i++){$('loaderText').textContent=`Uploading ${i+1} of ${files.length}`;urls.push(await uploadImage(t.treeCode,files[i]));}await saveTreesFresh(trees=>{const item=trees.find(x=>sameCode(x.treeCode,t.treeCode));if(!item)throw new Error('Tree record no longer exists.');item.photoGallery=[...(item.photoGallery||[]),...urls];if(!item.coverPhoto)item.coverPhoto=urls[0];item.updatedAt=nowISO();},`Upload photos for ${t.treeCode}`);hideLoader();closeModal();toast('Photos uploaded',`${urls.length} photo${urls.length===1?'':'s'} added to ${t.treeCode}.`);openTree(t.treeCode,false);}catch(e){hideLoader();toast('Upload failed',e.message,'error');}};}
function openTimelineForm(){if(!requireAdmin())return;const t=selectedTree();if(!t){toast('Select a tree','Open a tree profile before adding an update.','error');return;}openModal('Add Timeline Update',`<div class="form-grid"><div class="field"><label>Date</label><input id="updateDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Photo</label><input id="updatePhoto" type="file" accept="image/*"></div><div class="field full"><label>Description</label><textarea id="updateDesc" placeholder="Plantation Day, 3 Month Update, 6 Month Update, 1 Year Update"></textarea></div></div>`,`<button class="btn btn-soft" id="cancelTimeline">Cancel</button><button class="btn btn-primary" id="saveTimeline"><i class="fa-solid fa-plus"></i>Add Update</button>`);$('cancelTimeline').onclick=closeModal;$('saveTimeline').onclick=async()=>{const date=clean($('updateDate').value),desc=clean($('updateDesc').value),file=$('updatePhoto').files[0];if(!date||!desc){toast('Missing update details','Date and description are required.','error');return;}try{showLoader(file?'Uploading update photo':'Saving update');const photo=file?await uploadImage(t.treeCode,file,'updates'):'';await saveTreesFresh(trees=>{const item=trees.find(x=>sameCode(x.treeCode,t.treeCode));if(!item)throw new Error('Tree record no longer exists.');item.updates=[...(item.updates||[]),{date,photo,description:desc,createdAt:nowISO()}];if(photo)item.photoGallery=[...(item.photoGallery||[]),photo];if(photo&&!item.coverPhoto)item.coverPhoto=photo;item.updatedAt=nowISO();},`Add timeline update for ${t.treeCode}`);hideLoader();closeModal();toast('Timeline updated',`New update added to ${t.treeCode}.`);openTree(t.treeCode,false);}catch(e){hideLoader();toast('Update failed',e.message,'error');}};}
async function deleteTree(){if(!requireAdmin())return;const t=selectedTree();if(!t){toast('Select a tree','Open a tree profile before deleting.','error');return;}openModal('Delete Tree',`<p style="margin:0 0 10px;line-height:1.5;color:#4d5a51">Delete <strong>${esc(t.treeCode)}</strong> and remove its associated images from GitHub?</p><p class="hint">This action commits an updated trees.json and attempts to delete all photos linked to this tree.</p>`,`<button class="btn btn-soft" id="cancelDelete">Cancel</button><button class="btn btn-red" id="confirmDelete"><i class="fa-solid fa-trash"></i>Delete Permanently</button>`,true);$('cancelDelete').onclick=closeModal;$('confirmDelete').onclick=async()=>{try{showLoader('Deleting tree');await saveTreesFresh(trees=>{const idx=trees.findIndex(x=>sameCode(x.treeCode,t.treeCode));if(idx<0)throw new Error('Tree record no longer exists.');trees.splice(idx,1);},`Delete tree ${t.treeCode}`);const imgs=[t.coverPhoto,...(t.photoGallery||[]),...(t.updates||[]).map(u=>u.photo)].filter(Boolean);const unique=[...new Set(imgs)];for(let i=0;i<unique.length;i++){$('loaderText').textContent=`Deleting image ${i+1} of ${unique.length}`;try{await deleteImageUrl(unique[i]);}catch(e){}}hideLoader();closeModal();toast('Tree deleted',`${t.treeCode} was removed.`);closeProfile();applyFilter(true);}catch(e){hideLoader();toast('Delete failed',e.message,'error');}};}
async function setCoverPhoto(src){if(!requireAdmin())return;const t=selectedTree();if(!t)return;try{showLoader('Changing cover photo');await saveTreesFresh(trees=>{const item=trees.find(x=>sameCode(x.treeCode,t.treeCode));if(!item)throw new Error('Tree record no longer exists.');item.coverPhoto=src;if(!item.photoGallery.includes(src))item.photoGallery.unshift(src);item.updatedAt=nowISO();},`Change cover photo for ${t.treeCode}`);hideLoader();toast('Cover updated',`${t.treeCode} cover photo changed.`);openTree(t.treeCode,false);}catch(e){hideLoader();toast('Cover update failed',e.message,'error');}}
async function deleteTreePhoto(src){if(!requireAdmin())return;const t=selectedTree();if(!t)return;openModal('Delete Photo',`<p style="margin:0;color:#4d5a51;line-height:1.5">Remove this photo from the tree record and delete it from GitHub?</p>`,`<button class="btn btn-soft" id="cancelPhotoDelete">Cancel</button><button class="btn btn-red" id="confirmPhotoDelete">Delete Photo</button>`,true);$('cancelPhotoDelete').onclick=closeModal;$('confirmPhotoDelete').onclick=async()=>{try{showLoader('Deleting photo');await saveTreesFresh(trees=>{const item=trees.find(x=>sameCode(x.treeCode,t.treeCode));if(!item)throw new Error('Tree record no longer exists.');item.photoGallery=(item.photoGallery||[]).filter(p=>p!==src);item.updates=(item.updates||[]).map(u=>u.photo===src?{...u,photo:''}:u);if(item.coverPhoto===src)item.coverPhoto=item.photoGallery[0]||item.updates.find(u=>u.photo)?.photo||'';item.updatedAt=nowISO();},`Delete photo for ${t.treeCode}`);try{await deleteImageUrl(src)}catch(e){}hideLoader();closeModal();toast('Photo deleted','The image was removed.');openTree(t.treeCode,false);}catch(e){hideLoader();toast('Photo delete failed',e.message,'error');}};}
function exportJSON(){const data=JSON.stringify(state.trees,null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`bodhi-roots-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();URL.revokeObjectURL(a.href);a.remove();toast('Backup exported','JSON backup downloaded.');}
function downloadQR(){const t=selectedTree();if(!t){toast('Select a tree','Open a tree profile first.','error');return;}const holder=document.createElement('div');holder.style.position='fixed';holder.style.left='-9999px';document.body.appendChild(holder);new QRCode(holder,{text:treeLink(t.treeCode),width:800,height:800,colorDark:'#184B2D',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.H});setTimeout(()=>{const canvas=holder.querySelector('canvas');const img=holder.querySelector('img');const a=document.createElement('a');a.download=`${t.treeCode}-qr.png`;a.href=canvas?canvas.toDataURL('image/png'):(img?img.src:'');if(a.href){document.body.appendChild(a);a.click();a.remove();toast('QR downloaded',`${t.treeCode} QR code downloaded.`);}holder.remove();},80);}
function handleAdminAction(action){if(action==='add')openAddForm();if(action==='edit')openEditForm();if(action==='photos')openPhotoUpload();if(action==='timeline')openTimelineForm();if(action==='delete')deleteTree();if(action==='export')exportJSON();if(action==='qr')downloadQR();}
async function loadTrees(){if(!validConfig()){$('configWarning').classList.add('show');setSync('err','Config');state.trees=[];applyFilter(false);return;}try{$('configWarning').classList.remove('show');showLoader('Loading trees');const fresh=await getTreesFresh();state.trees=fresh.trees;hideLoader();applyFilter(true);toast('Map loaded',`${state.trees.length} tree record${state.trees.length===1?'':'s'} loaded from GitHub.`);const deep=new URLSearchParams(location.search).get('tree');if(deep)setTimeout(()=>openTree(deep,true),450);}catch(e){hideLoader();setSync('err','Error');toast('Loading failed',e.message,'error',7000);state.trees=[];applyFilter(false);}}
function bindEvents(){$('brandLogo').addEventListener('click',()=>{state.logoClicks++;clearTimeout(state.logoTimer);state.logoTimer=setTimeout(()=>state.logoClicks=0,1700);if(state.logoClicks>=5){state.logoClicks=0;openPassword();}});$('brandLogo').addEventListener('keydown',e=>{if(e.key==='Enter')$('brandLogo').click();});$('searchInput').addEventListener('input',debounce(()=>applyFilter(false),170));$('clearSearch').addEventListener('click',()=>{$('searchInput').value='';applyFilter(false);$('searchInput').focus();});$('treeList').addEventListener('click',e=>{const card=e.target.closest('[data-tree]');if(card)openTree(card.dataset.tree,true);});$('closeProfile').addEventListener('click',closeProfile);$('modalClose').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modalBackdrop').classList.contains('show'))closeModal();else if($('profilePanel').classList.contains('open'))closeProfile();}});$('adminBar').addEventListener('click',e=>{const btn=e.target.closest('[data-admin]');if(btn)handleAdminAction(btn.dataset.admin);});$('profileContent').addEventListener('click',e=>{const admin=e.target.closest('[data-admin]');if(admin){handleAdminAction(admin.dataset.admin);return;}const photo=e.target.closest('[data-photo-action]');if(photo){e.preventDefault();e.stopPropagation();if(photo.dataset.photoAction==='cover')setCoverPhoto(photo.dataset.photo);if(photo.dataset.photoAction==='delete')deleteTreePhoto(photo.dataset.photo);}});$('mobileHandle').addEventListener('click',()=>$('sidebar').classList.toggle('expanded'));window.addEventListener('resize',()=>setTimeout(()=>state.map&&state.map.invalidateSize(),180));}
window.BodhiApp={openByCode:openTree};
window.addEventListener('DOMContentLoaded',()=>{initMap();bindEvents();loadTrees();});
})();
</script>
