function openAddForm(initial={}){if(!requireAdmin())return;openModal('Create Tree',`<form id="treeForm">${formFields({status:'Planted',...initial})}</form>`,`<button class="btn btn-soft" id="cancelForm">Cancel</button><button class="btn btn-primary" id="saveTree">Create Tree</button>`);attachTreeLocationPicker('add','');$('cancelForm').onclick=closeModal;$('saveTree').onclick=async()=>{try{const form=$('treeForm'),data=getFormData(form),file=form.elements.coverPhoto.files[0];showLoader('Creating tree');let cover='';if(file){$('loaderText').textContent='Uploading cover photo';cover=await uploadImage(data.treeCode,file)}await saveTreesFresh(trees=>{if(trees.some(t=>sameCode(t.treeCode,data.treeCode)))throw new Error('A tree with this Tree Code already exists.');ensureSiteCoords(data,trees);trees.push(normalizeTree({...data,id:data.treeCode,coverPhoto:cover,photoGallery:cover?[cover]:[],updates:[],createdAt:nowISO(),updatedAt:nowISO()}))},`Create tree ${data.treeCode}`);hideLoader();closeModal();toast('Tree created',`${data.treeCode} was saved.`);openTree(data.treeCode,true)}catch(e){hideLoader();toast('Create failed',e.message,'error')}}}

function startGeofenceEditor(){if(!requireAdmin())return;state.geofenceEdit=true;state.addCornerMode=false;state.geofenceOriginal=cloneFence();state.geofenceDraft=cloneFence();$('geofenceToolbar').classList.add('show');state.map.setMaxBounds(null);refreshGeofenceHandles();fitGeofence();toast('Geofence editing','Drag gold corners. Add Corner then click the map to add a point.')}function stopGeofenceEditor(save=false){state.geofenceEdit=false;state.addCornerMode=false;$('geofenceToolbar').classList.remove('show');clearGeofenceHandles();applySiteConfigToMap(true)}function clearGeofenceHandles(){state.geofenceMarkers.forEach(m=>state.map.removeLayer(m));state.geofenceMarkers=[]}function geofenceHandleIcon(i){return L.divIcon({className:'',html:`<div class="fence-handle">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}

function handleAdminAction(action){if(action==='add')openAddForm();if(action==='edit')openEditForm();if(action==='photos')openPhotoUpload();if(action==='timeline')openTimelineForm();if(action==='geofence')startGeofenceEditor();if(action==='delete')deleteTree();if(action==='export')exportJSON();if(action==='qr')downloadQR()}
async function loadTrees(){try{showLoader('Loading site');await loadSiteConfigPublic();applySiteConfigToMap(true);$('loaderText').textContent='Loading trees';const fresh=await getTreesFresh();state.trees=fresh.trees;hideLoader();applyFilter(true);const deep=new URLSearchParams(location.search).get('tree');if(deep)setTimeout(()=>openTree(deep,true),450);setSync('ok','Live')}catch(e){hideLoader();setSync('err','Error');toast('Loading failed',e.message,'error',7000);state.trees=[];applyFilter(false)}}
function bindEvents(){$('brandLogo').addEventListener('click',()=>state.admin?openAdminPanel():openPassword());$('brandLogo').addEventListener('keydown',e=>{if(e.key==='Enter')$('brandLogo').click()});$('adminLoginBtn').onclick=openPassword;$('adminPanelBtn').onclick=openAdminPanel;$('adminLogoutBtn').onclick=logoutAdmin;$('addFenceCorner').onclick=addFenceMode;$('removeFenceCorner').onclick=removeLastGeofenceCorner;$('saveFence').onclick=saveGeofenceBoundary;$('cancelFence').onclick=cancelFence;$('confirmTreeLocation').onclick=confirmTreeLocation;$('cancelTreeLocation').onclick=cancelTreeLocation;$('searchInput').addEventListener('input',debounce(()=>applyFilter(false),170));$('clearSearch').onclick=()=>{$('searchInput').value='';applyFilter(false);$('searchInput').focus()};$('treeList').onclick=e=>{const card=e.target.closest('[data-tree]');if(card)openTree(card.dataset.tree,true)};$('closeProfile').onclick=closeProfile;$('modalClose').onclick=closeModal;$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modalBackdrop').classList.contains('show'))closeModal();else if($('profilePanel').classList.contains('open'))closeProfile()}});$('adminBar').onclick=e=>{const b=e.target.closest('[data-admin]');if(b)handleAdminAction(b.dataset.admin)};$('profileContent').onclick=e=>{const b=e.target.closest('[data-admin]');if(b)handleAdminAction(b.dataset.admin)};$('mobileHandle').onclick=()=>$('sidebar').classList.toggle('expanded');window.addEventListener('resize',()=>setTimeout(()=>state.map&&state.map.invalidateSize(),180))}
window.BodhiApp={openByCode:openTree};window.addEventListener('DOMContentLoaded',()=>{initMap();bindEvents();restoreSession();loadTrees()});
})();
</script>
